<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Prototype — Camera / Sheet / Viewer</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e9eff2;color:#172b35;font:15px system-ui,sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:0;color:inherit}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #00a99b;outline-offset:3px}button{min-width:48px;min-height:48px}button:disabled{opacity:.5;cursor:default}[hidden]{display:none!important}.review{max-width:1080px;margin:24px auto;padding:0 20px}.review h1{font-size:20px;margin:0 0 8px}.review p{color:#526771;margin:8px 0}.tools{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.tools button,.tools select{border-radius:12px;padding:8px 12px;background:white;border:1px solid #ccd8dd}.state{font-size:13px;min-height:20px}.device{position:relative;width:390px;height:844px;margin:20px auto;background:var(--bg);color:var(--fg);border-radius:34px;overflow:hidden;border:1px solid #c6d4da;box-shadow:0 24px 70px #233d4b25;--bg:#edf2f6;--fg:#182d3b;--sub:#61737d;--glass:#ffffff8c;--edge:#ffffffcf;--accent:#007e78;--card:#ffffff77}.device.dark{--bg:#101e28;--fg:#f2f7fa;--sub:#a8bac5;--glass:#203846a8;--edge:#a2dce83d;--accent:#5ae2d0;--card:#28404d80}.glass{background:var(--glass);border:1px solid var(--edge);backdrop-filter:blur(24px) saturate(160%);box-shadow:inset 0 1px 0 var(--edge),0 4px 16px #132c3b0a}.app{height:100%;display:flex;flex-direction:column;background:radial-gradient(ellipse at 100% 15%,#2dc9b523,transparent 60%)}header{padding:24px 16px 12px}header h2{font-size:19px;margin:0 0 24px;display:flex;align-items:center;gap:8px}.sample{font-size:10px;background:#00a39318;color:var(--accent);padding:5px 8px;border-radius:20px}.search{display:flex;gap:8px}input{width:100%;min-width:0;min-height:48px;padding:10px 14px;border-radius:30px;color:var(--fg);outline:none}select.area{max-width:130px;border-radius:30px;padding:0 10px;color:var(--accent);font-weight:600}select option{background:var(--bg);color:var(--fg)}.switches{padding:4px 16px 16px;display:flex;justify-content:space-between;gap:6px}.modes{display:flex;border-radius:30px;padding:3px}.modes button{background:transparent;border-radius:26px;font-size:13px;min-width:52px;min-height:42px}.modes button[aria-pressed=true]{background:#007e78;color:white}.filter{border-radius:30px;padding:0 12px;font-size:12px}.star{color:#f5ab00;font-size:24px}.feed{overflow:auto;flex:1;padding:0 16px 28px;scrollbar-width:none}.section-title{font-size:17px;display:flex;align-items:center;justify-content:space-between;margin:4px 0 14px}.section-title button{background:transparent}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:24px}.camera{position:relative;background:var(--card);border:1px solid #a4b7c52c;border-radius:19px;overflow:hidden}.open-camera{display:block;width:100%;padding:0;text-align:left;background:transparent}.camera img{width:100%;aspect-ratio:16/10;object-fit:cover;display:block}.camera .label{padding:10px}.camera strong{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.camera small{display:block;margin-top:4px;color:var(--sub);font-size:11px}.save{position:absolute;right:6px;top:6px;border-radius:50%;background:#142b3b66;color:#ffbd22;width:48px;height:48px;backdrop-filter:blur(14px);font-size:26px}.grid.card{grid-template-columns:1fr}.grid.list{grid-template-columns:1fr;gap:8px}.list .open-camera{display:flex;align-items:center;padding-right:45px}.list img{width:110px;height:80px}.list .label{min-width:0}.list .save{top:16px;right:0;background:transparent}.empty{padding:32px 16px;text-align:center;color:var(--sub)}.empty b{display:block;color:var(--fg);margin:12px}.empty button{border-radius:25px;background:#007e78;color:white;padding:0 20px;margin-top:16px}.scrim{position:absolute;inset:0;background:#16243155;backdrop-filter:blur(2px);z-index:2}.sheet{position:absolute;bottom:0;left:0;right:0;z-index:3;border-radius:32px 32px 0 0;padding:10px 16px 24px;max-height:92%;overflow:auto;box-shadow:0 -8px 40px #11243020}.handle{width:42px;height:5px;background:#96adb577;border-radius:10px;margin:0 auto 14px;touch-action:none}.sheet-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}.round{width:48px;height:48px;border-radius:50%;flex-shrink:0;font-size:24px}.sheet-name{flex:1;min-width:0}.sheet-name h3{font-size:16px;margin:0;line-height:1.4}.sheet-name small{display:block;color:var(--sub);font-size:12px;margin-top:3px}.photo-target{width:100%;padding:0;border-radius:19px;overflow:hidden;background:#0e1b23;display:block;aspect-ratio:16/9}.photo-target img{display:block;width:100%;height:100%;object-fit:contain}.placeholder{width:100%;aspect-ratio:16/9;border-radius:19px;background:linear-gradient(115deg,#91a9b522,#91a9b555,#91a9b522);display:grid;place-content:center;text-align:center;color:var(--sub);gap:10px}.placeholder button{background:transparent;color:var(--accent);text-decoration:underline}.home{width:100px;height:4px;border-radius:4px;background:#8b9ba866;position:absolute;bottom:7px;left:50%;transform:translateX(-50%);pointer-events:none}.viewer{position:absolute;inset:0;z-index:4;background:#080d12;color:#fff;display:flex;flex-direction:column}.viewer-head{position:absolute;top:0;left:0;right:0;z-index:2;padding:16px;display:flex;align-items:center;gap:14px;background:linear-gradient(#0009,transparent)}.viewer-head h3{font-size:15px;margin:0}.viewer-head .round{background:#ffffff22;border:1px solid #ffffff33}.stage{height:100%;width:100%;overflow:hidden;display:flex;align-items:center;justify-content:center;touch-action:none}.stage img{width:100%;height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none;will-change:transform}.viewer-hint{position:absolute;bottom:24px;left:0;right:0;text-align:center;pointer-events:none;color:#ffffff99;font-size:12px}.device.landscape{width:844px;height:390px}.device.landscape .viewer-head{padding:12px 22px}.device.landscape .viewer-hint{bottom:12px}body.dark-review{background:#17232d;color:#e9f3f8}body.dark-review .review p{color:#a5bac5}body.dark-review .tools button,body.dark-review .tools select{background:#2c4350;color:#edf5f8;border-color:#45616f}
@media(max-width:600px){.review{margin:12px auto;padding:0 12px}.device,.device.landscape{width:min(100%,390px);height:760px;margin:14px auto}.device.viewer-active{width:100%;height:calc(100dvh - 16px)}body:has(.viewer-active) .review{display:none}body:has(.viewer-active) .device{margin:8px auto;border-radius:16px}@media(orientation:landscape){.device.viewer-active{width:100%;height:calc(100dvh - 16px)}}}
</style>
<style type="text/css">.review{display:none!important}body{min-width:0;background:#eef3f7!important}.device{margin:16px auto!important}</style></head><body>
<main class="device" id="device"><div class="app" id="app"><header><h2>◉ Camera TP.HCM <span class="sample">Dữ liệu mẫu</span></h2><div class="search"><input class="glass" id="query" aria-label="Tìm camera" placeholder="Tìm tên đường hoặc camera…" style=""><select class="area glass" id="area" aria-label="Khu vực"><option value="">TP.HCM</option><option>Trung tâm</option><option>Linh Trung</option></select></div></header><div class="switches"><div class="modes glass"><button data-mode="card" aria-pressed="false">Card</button><button data-mode="grid" aria-pressed="true">Grid</button><button data-mode="list" aria-pressed="false">List</button></div><button class="filter glass" id="filter" aria-pressed="true"><span class="star">★</span> Chỉ quan tâm</button></div><div class="feed" id="feed"><h3 class="section-title">★ Quan tâm <button id="collapse" aria-label="Thu gọn Quan tâm">⌃</button></h3><div id="favorites"><div class="empty"><span class="star">☆</span><b>Chưa có camera Quan tâm</b>Chạm ngôi sao trên camera để lưu tại đây.<br><button id="find-camera">Tìm camera</button></div></div><h3 class="section-title" id="all-title" hidden="">Camera trong khu vực</h3><div id="catalog"></div></div></div>
<div class="scrim" id="scrim" hidden=""></div><section class="sheet glass" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden=""><div class="handle" id="handle"></div><div class="sheet-head"><button class="round glass" id="close-sheet" aria-label="Đóng ảnh camera">×</button><div class="sheet-name"><h3 id="sheet-title"></h3><small id="sheet-area"></small></div><button class="round glass star" id="sheet-star" aria-label="Bỏ Quan tâm">★</button></div><button class="photo-target" id="open-viewer" aria-label="Mở ảnh toàn màn hình"><img id="sheet-img" alt=""></button><div class="placeholder" id="loading" hidden="" role="status">Đang tải ảnh…</div><div class="placeholder" id="error" hidden=""><span>Chưa tải được ảnh</span><button id="retry">Thử lại</button></div></section>
<section class="viewer" id="viewer" role="dialog" aria-modal="true" aria-labelledby="viewer-title" hidden=""><div class="viewer-head"><button class="round" id="close-viewer" aria-label="Đóng toàn màn hình">×</button><h3 id="viewer-title"></h3></div><div class="stage" id="stage"><img id="viewer-img" alt=""></div><div class="viewer-hint">Chụm để zoom · Chạm hai lần để phóng to / thu về</div></section><div class="home"></div></main>

</body></html>
